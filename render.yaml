services:
  - type: web
    name: thoughtsplat-preview
    runtime: node
    plan: free
    region: ohio
    branch: codex/thoughtsplat-mobile-workspace
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: NODE_ENV
        value: production
      - key: PREVIEW_USERNAME
        value: preview
      - key: PREVIEW_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
